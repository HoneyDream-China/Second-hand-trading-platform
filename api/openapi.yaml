openapi: 3.0.3
info:
  title: Campus Market API
  version: 1.0.0
  description: 校园二手商品交易系统统一接口契约
servers:
  - url: /api/v1
tags:
  - name: Auth
  - name: Users
  - name: Products
  - name: Trades
paths:
  /auth/register:
    post:
      tags: [Auth]
      summary: 注册
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '200': { $ref: '#/components/responses/UserResponse' }
        '400': { $ref: '#/components/responses/ErrorResponse' }
  /auth/login:
    post:
      tags: [Auth]
      summary: 登录
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiLoginView' }
        '401': { $ref: '#/components/responses/ErrorResponse' }
  /auth/logout:
    post:
      tags: [Auth]
      security: [{ bearerAuth: [] }]
      summary: 注销当前 Token
      responses:
        '204': { description: 注销成功 }
  /users/me:
    get:
      tags: [Users]
      security: [{ bearerAuth: [] }]
      summary: 获取当前用户
      responses: { '200': { $ref: '#/components/responses/UserResponse' } }
    put:
      tags: [Users]
      security: [{ bearerAuth: [] }]
      summary: 修改当前用户资料
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserUpdateRequest' }
      responses: { '200': { $ref: '#/components/responses/UserResponse' } }
  /users/me/password:
    put:
      tags: [Users]
      security: [{ bearerAuth: [] }]
      summary: 修改密码
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordChangeRequest' }
      responses: { '204': { description: 修改成功 } }
  /products:
    get:
      tags: [Products]
      summary: 分页查询商品
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
        - { in: query, name: keyword, schema: { type: string } }
        - { in: query, name: category, schema: { type: string } }
        - { in: query, name: minPrice, schema: { type: number, format: double, minimum: 0 } }
        - { in: query, name: maxPrice, schema: { type: number, format: double, minimum: 0 } }
      responses: { '200': { $ref: '#/components/responses/ProductPageResponse' } }
    post:
      tags: [Products]
      security: [{ bearerAuth: [] }]
      summary: 发布商品
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductCreateRequest' }
      responses: { '200': { $ref: '#/components/responses/ProductResponse' } }
  /products/{id}:
    get:
      tags: [Products]
      summary: 查询商品详情
      parameters: [{ $ref: '#/components/parameters/ProductId' }]
      responses: { '200': { $ref: '#/components/responses/ProductResponse' } }
    put:
      tags: [Products]
      security: [{ bearerAuth: [] }]
      summary: 修改自己的商品
      parameters: [{ $ref: '#/components/parameters/ProductId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductUpdateRequest' }
      responses: { '200': { $ref: '#/components/responses/ProductResponse' } }
  /products/{id}/status:
    patch:
      tags: [Products]
      security: [{ bearerAuth: [] }]
      summary: 上下架商品
      parameters: [{ $ref: '#/components/parameters/ProductId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status, version]
              properties:
                status: { $ref: '#/components/schemas/ProductStatus' }
                version: { type: integer, format: int64, minimum: 0 }
      responses: { '200': { $ref: '#/components/responses/ProductResponse' } }
  /trades:
    get:
      tags: [Trades]
      security: [{ bearerAuth: [] }]
      summary: 查询我的交易
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
        - { in: query, name: status, schema: { $ref: '#/components/schemas/TradeStatus' } }
      responses: { '200': { $ref: '#/components/responses/TradePageResponse' } }
    post:
      tags: [Trades]
      security: [{ bearerAuth: [] }]
      summary: 发起交易申请
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [productId]
              properties:
                productId: { type: integer, format: int64 }
                message: { type: string, maxLength: 500 }
      responses: { '200': { $ref: '#/components/responses/TradeResponse' } }
  /trades/{id}:
    get:
      tags: [Trades]
      security: [{ bearerAuth: [] }]
      summary: 查询交易详情
      parameters: [{ $ref: '#/components/parameters/TradeId' }]
      responses: { '200': { $ref: '#/components/responses/TradeResponse' } }
  /trades/{id}/accept:
    patch:
      tags: [Trades]
      security: [{ bearerAuth: [] }]
      summary: 卖家接受交易
      parameters: [{ $ref: '#/components/parameters/TradeId' }]
      responses: { '200': { $ref: '#/components/responses/TradeResponse' } }
  /trades/{id}/reject:
    patch:
      tags: [Trades]
      security: [{ bearerAuth: [] }]
      summary: 卖家拒绝交易
      parameters: [{ $ref: '#/components/parameters/TradeId' }]
      responses: { '200': { $ref: '#/components/responses/TradeResponse' } }
  /trades/{id}/cancel:
    patch:
      tags: [Trades]
      security: [{ bearerAuth: [] }]
      summary: 买家取消交易
      parameters: [{ $ref: '#/components/parameters/TradeId' }]
      responses: { '200': { $ref: '#/components/responses/TradeResponse' } }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: Token }
  parameters:
    Page: { in: query, name: page, schema: { type: integer, default: 1, minimum: 1 } }
    Size: { in: query, name: size, schema: { type: integer, default: 20, minimum: 1, maximum: 100 } }
    ProductId: { in: path, name: id, required: true, schema: { type: integer, format: int64 } }
    TradeId: { in: path, name: id, required: true, schema: { type: integer, format: int64 } }
  schemas:
    ApiUserView:
      type: object
      properties:
        code: { type: string, example: OK }
        message: { type: string, example: success }
        data: { $ref: '#/components/schemas/UserView' }
        traceId: { type: string }
    RegisterRequest:
      type: object
      required: [account, password, nickname]
      properties:
        account: { type: string, minLength: 3, maxLength: 64 }
        password: { type: string, minLength: 8, maxLength: 72, writeOnly: true }
        nickname: { type: string, minLength: 1, maxLength: 64 }
        phone: { type: string, maxLength: 32 }
    LoginRequest:
      type: object
      required: [account, password]
      properties:
        account: { type: string }
        password: { type: string, writeOnly: true }
    UserUpdateRequest:
      type: object
      properties:
        nickname: { type: string, maxLength: 64 }
        avatarUrl: { type: string, maxLength: 512 }
        phone: { type: string, maxLength: 32 }
    PasswordChangeRequest:
      type: object
      required: [oldPassword, newPassword]
      properties:
        oldPassword: { type: string, writeOnly: true }
        newPassword: { type: string, minLength: 8, maxLength: 72, writeOnly: true }
    UserView:
      type: object
      properties:
        id: { type: integer, format: int64 }
        account: { type: string }
        nickname: { type: string }
        avatarUrl: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        status: { type: string, enum: [ACTIVE, DISABLED] }
        createdAt: { type: string, format: date-time }
    ProductCreateRequest:
      type: object
      required: [title, description, price, category, condition]
      properties:
        title: { type: string, maxLength: 120 }
        description: { type: string }
        price: { type: number, format: double, minimum: 0 }
        category: { type: string, maxLength: 64 }
        condition: { type: string, maxLength: 32 }
        imageUrls: { type: array, maxItems: 9, items: { type: string, maxLength: 512 } }
    ProductUpdateRequest:
      allOf:
        - $ref: '#/components/schemas/ProductCreateRequest'
        - type: object
          required: [version]
          properties:
            version: { type: integer, format: int64, minimum: 0 }
    ProductStatus: { type: string, enum: [DRAFT, ON_SALE, SOLD, OFF_SHELF] }
    ProductView:
      type: object
      properties:
        id: { type: integer, format: int64 }
        sellerId: { type: integer, format: int64 }
        title: { type: string }
        description: { type: string }
        price: { type: number, format: double }
        category: { type: string }
        condition: { type: string }
        status: { $ref: '#/components/schemas/ProductStatus' }
        version: { type: integer, format: int64 }
        imageUrls: { type: array, items: { type: string } }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    TradeStatus: { type: string, enum: [PENDING, ACCEPTED, REJECTED, CANCELLED] }
    TradeView:
      type: object
      properties:
        id: { type: integer, format: int64 }
        productId: { type: integer, format: int64 }
        buyerId: { type: integer, format: int64 }
        sellerId: { type: integer, format: int64 }
        message: { type: string, nullable: true }
        status: { $ref: '#/components/schemas/TradeStatus' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    LoginView:
      type: object
      properties:
        token: { type: string }
        expiresAt: { type: string, format: date-time }
        user: { $ref: '#/components/schemas/UserView' }
    Page:
      type: object
      properties:
        items: { type: array, items: {} }
        page: { type: integer }
        size: { type: integer }
        total: { type: integer, format: int64 }
    Error:
      type: object
      properties:
        code: { type: string }
        message: { type: string }
        data: { nullable: true }
        traceId: { type: string }
    ApiLoginView:
      type: object
      properties:
        code: { type: string }
        message: { type: string }
        data: { $ref: '#/components/schemas/LoginView' }
        traceId: { type: string }
  responses:
    UserResponse:
      description: 用户响应
      content: { application/json: { schema: { $ref: '#/components/schemas/ApiUserView' } } }
    ProductResponse:
      description: 商品响应
      content: { application/json: { schema: { type: object } } }
    ProductPageResponse:
      description: 商品分页响应
      content: { application/json: { schema: { type: object } } }
    TradeResponse:
      description: 交易响应
      content: { application/json: { schema: { type: object } } }
    TradePageResponse:
      description: 交易分页响应
      content: { application/json: { schema: { type: object } } }
    ErrorResponse:
      description: 统一错误响应
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
